# Cada cambio en master (Merge del PR de Release o un push directo a master) se trae a develop,
# para que la app de pruebas y el PR «Release a producción» no se desfasen de producción.
# Si hay conflicto no fuerza nada: lo avisa en el PR de Release y sale en rojo para que
# alguien haga el merge a mano.
#
# El push a develop lo hace GITHUB_TOKEN, que no dispara workflows de GitHub; por eso al
# final se lanza a mano «Release a producción». (EAS sí recibe el push y publica pruebas.)
name: Sincronizar develop

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: sync-develop
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Traer master a develop
        id: merge
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --quiet origin master develop
          if git merge-base --is-ancestor origin/master HEAD; then
            echo "develop ya tiene todo lo de master." >> "$GITHUB_STEP_SUMMARY"
            echo "resultado=nada" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git merge --no-edit -m "Merge branch 'master' into develop" origin/master; then
            git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflictos.txt"
            git merge --abort
            echo "resultado=conflicto" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git push origin HEAD:develop
          echo "develop actualizado con master (\`$(git rev-parse --short=9 HEAD)\`)." >> "$GITHUB_STEP_SUMMARY"
          echo "resultado=actualizado" >> "$GITHUB_OUTPUT"

      - name: Avisar del conflicto
        if: steps.merge.outputs.resultado == 'conflicto'
        run: |
          {
            echo "⚠️ **develop no pudo traer los cambios de \`master\` (\`${GITHUB_SHA::9}\`) automáticamente**: hay conflicto en"
            sed 's/.*/- `&`/' "$RUNNER_TEMP/conflictos.txt"
            echo
            echo 'Resuélvelo en tu máquina: `git switch develop && git pull && git merge origin/master`, arregla los archivos, commit y `git push`.'
          } > "$RUNNER_TEMP/aviso.md"
          cat "$RUNNER_TEMP/aviso.md" >> "$GITHUB_STEP_SUMMARY"
          n=$(gh pr list --base master --head develop --state open --json number -q '.[0].number')
          if [ -n "$n" ]; then
            gh pr comment "$n" --body-file "$RUNNER_TEMP/aviso.md"
          fi
          exit 1

      - name: Actualizar el PR de Release
        if: steps.merge.outputs.resultado == 'actualizado'
        run: gh workflow run release-pr.yml --ref develop
